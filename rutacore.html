<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RutaCore — UrbanCore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root{
  --brand:#007aff;--brand-dark:#005ec4;
  --bg:#eef1f8;--card:#fff;--text:#1c1c1e;--text-2:#6e6e73;
  --border:#e5e5ea;--radius-sm:10px;--radius-md:16px;--radius-lg:22px;
  --header-h:60px;--panel-w:288px;--info-bar-h:42px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 20px rgba(0,0,0,.11);

  /* ── Liquid glass tokens ── */
  --glass-bg:rgba(255,255,255,.42);
  --glass-bg-strong:rgba(255,255,255,.62);
  --glass-bg-soft:rgba(255,255,255,.30);
  --glass-border:rgba(255,255,255,.65);
  --glass-border-soft:rgba(255,255,255,.4);
  --glass-blur:blur(28px) saturate(1.9);
  --glass-blur-soft:blur(18px) saturate(1.6);
  --glass-shadow:0 8px 32px rgba(31,44,80,.14), 0 1px 1px rgba(255,255,255,.6) inset, 0 -1px 1px rgba(255,255,255,.3) inset;
  --glass-shadow-sm:0 4px 16px rgba(31,44,80,.12), 0 1px 0 rgba(255,255,255,.7) inset;
  --glass-highlight:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 45%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  color:var(--text);font-size:14px;
  background:
    radial-gradient(circle at 8% 12%, rgba(255,122,220,.55), transparent 42%),
    radial-gradient(circle at 85% 8%, rgba(90,150,255,.55), transparent 45%),
    radial-gradient(circle at 25% 85%, rgba(120,225,210,.5), transparent 48%),
    radial-gradient(circle at 90% 80%, rgba(255,196,110,.45), transparent 45%),
    linear-gradient(135deg, #dfe7fb 0%, #eef1f8 50%, #e6f2f0 100%);
  background-attachment:fixed;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.5), transparent 30%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.35), transparent 35%);
  animation:driftGlow 22s ease-in-out infinite alternate;
}
@keyframes driftGlow{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(2%,-2%) scale(1.06)}
}

/* ── HEADER ── */
#app-header{position:fixed;top:12px;left:12px;right:12px;height:var(--header-h);background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:1100;gap:12px}
#app-header::before{content:'';position:absolute;inset:0;border-radius:var(--radius-lg);background:var(--glass-highlight);opacity:.5;pointer-events:none}
.header-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);font-weight:400}
.breadcrumb a{color:var(--text-2);text-decoration:none;transition:.15s}
.breadcrumb a:hover{color:var(--brand)}
.header-divider{width:1px;height:20px;background:rgba(0,0,0,.1);margin:0 4px}
.logo{font-size:15px;font-weight:700;color:var(--brand);letter-spacing:-.4px;white-space:nowrap}
.logo span{color:var(--text)}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}

/* ── BOTONES ── */
.btn{position:relative;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--glass-border-soft);background:rgba(255,255,255,.5);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:var(--text);cursor:pointer;transition:.18s ease;white-space:nowrap;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 0 rgba(255,255,255,.6) inset;overflow:hidden}
.btn:hover{background:rgba(255,255,255,.75);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.7) inset}
.btn.primary{background:linear-gradient(180deg, rgba(64,150,255,.95), rgba(0,110,235,.95));border-color:rgba(255,255,255,.5);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.4), 0 1px 0 rgba(255,255,255,.4) inset}
.btn.primary:hover{background:linear-gradient(180deg, rgba(84,165,255,1), rgba(0,120,250,1))}
.btn.loaded{background:rgba(200,250,220,.6);border-color:rgba(180,240,200,.7);color:#0a7a32}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.mode-active{background:linear-gradient(180deg, rgba(64,150,255,.95), rgba(0,110,235,.95));border-color:rgba(255,255,255,.5);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.35)}
.btn.mode-active:hover{background:linear-gradient(180deg, rgba(84,165,255,1), rgba(0,120,250,1))}
/* grupo de botones */
.btn-group{display:flex;align-items:center;gap:3px;padding:4px;background:rgba(255,255,255,.35);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border-radius:999px;border:1px solid var(--glass-border-soft);box-shadow:0 2px 8px rgba(0,0,0,.06) inset}
.btn-group .btn{border:none;background:transparent;padding:6px 11px;border-radius:999px;box-shadow:none}
.btn-group .btn:hover{background:rgba(255,255,255,.7);transform:none;box-shadow:none}
.btn-group .btn.mode-active{background:linear-gradient(180deg, rgba(64,150,255,.95), rgba(0,110,235,.95));color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.35)}
.btn-group .btn:disabled{opacity:.35}
input[type=file]{display:none}

/* ── STATUS PILL ── */
.status-pill{font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border-soft);border-radius:999px;padding:5px 12px;white-space:nowrap;font-weight:500;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.status-pill.ok{color:#0a7a32;background:rgba(210,250,225,.55);border-color:rgba(180,240,200,.7)}

/* ── MAPA ── */
#map{position:fixed;top:0;left:0;right:0;bottom:0;filter:saturate(1.08)}
#map.cursor-trace{cursor:cell}
#map.cursor-delete{cursor:not-allowed}
#map.cursor-draw{cursor:crosshair}

/* ── PANEL LATERAL ── */
#panel{position:fixed;top:84px;left:12px;width:var(--panel-w);bottom:66px;overflow-y:auto;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);z-index:900;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px}

.panel-top{padding:16px 14px 14px;border-bottom:1px solid rgba(0,0,0,.06)}
.panel-top-header{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.panel-section-icon{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:rgba(0,122,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.panel-top-title{font-size:11.5px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:11.5px;color:var(--text-2);line-height:1.55}

/* Nueva ruta */
.new-route-row{display:flex;gap:6px;align-items:center}
.new-route-row input[type=text]{flex:1;border:1px solid var(--glass-border-soft);border-radius:999px;padding:8px 12px;font-size:12.5px;color:var(--text);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);font-family:inherit;transition:.15s}
.new-route-row input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.new-route-row input[type=text]:disabled{background:rgba(255,255,255,.25);opacity:.6}
.color-swatch{width:32px;height:32px;border-radius:999px;border:1px solid var(--glass-border-soft);cursor:pointer;flex-shrink:0;padding:0;box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.color-swatch::-webkit-color-swatch-wrapper{padding:2px;border-radius:999px}
.color-swatch::-webkit-color-swatch{border:none;border-radius:999px}
.btn-add-route{padding:6px 12px;font-size:16px;line-height:1;font-weight:700;border-radius:999px}

/* Lista de rutas */
.panel-routes{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:0}
#routes-list{display:flex;flex-direction:column;gap:5px}
.route-item{border-radius:var(--radius-md);border:1px solid transparent;background:rgba(255,255,255,.32);backdrop-filter:blur(6px);overflow:hidden;transition:.18s}
.route-item:hover{border-color:var(--glass-border-soft);background:rgba(255,255,255,.55)}
.route-item.selected{border-color:rgba(0,122,255,.5);background:rgba(220,238,255,.6);box-shadow:0 2px 10px rgba(0,122,255,.15)}
.route-header{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.route-color-bar{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.route-name-wrap{flex:1;min-width:0}
.route-name-input{font-size:12.5px;font-weight:600;color:var(--text);background:transparent;border:none;outline:none;width:100%;font-family:inherit;cursor:pointer}
.route-name-input:focus{cursor:text}
.route-km{font-size:10.5px;color:var(--text-2);margin-top:2px}
.route-vis{background:none;border:none;cursor:pointer;font-size:13px;padding:3px;border-radius:4px;opacity:.45;transition:.15s;flex-shrink:0}
.route-vis:hover{opacity:1}
.route-del{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-2);padding:3px;border-radius:4px;opacity:.45;transition:.15s;flex-shrink:0}
.route-del:hover{opacity:1;color:#c0392b}
.route-order{display:flex;flex-direction:column;flex-shrink:0}
.route-move-up,.route-move-down{background:none;border:none;cursor:pointer;font-size:9px;color:var(--text-2);padding:1px 3px;border-radius:3px;opacity:.4;transition:.15s;line-height:1}
.route-move-up:hover,.route-move-down:hover{opacity:1;background:rgba(0,0,0,.06)}
.route-move-up:disabled,.route-move-down:disabled{opacity:.12;cursor:default}
.route-move-up:disabled:hover,.route-move-down:disabled:hover{background:none}

/* Variantes */
.variant-btns{display:flex;gap:4px;padding:0 10px 9px}
.var-btn{flex:1;padding:6px 7px;border-radius:8px;font-size:11.5px;font-weight:500;border:1px solid var(--glass-border-soft);background:rgba(255,255,255,.45);color:var(--text-2);cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;gap:4px}
.var-btn:hover{background:rgba(220,238,255,.6);border-color:rgba(0,122,255,.3);color:var(--brand)}
.var-btn.active-var{border-color:var(--brand);color:var(--brand);background:rgba(220,238,255,.75)}
.var-btn.hidden-var{opacity:.4;text-decoration:line-through}
.var-btn .var-left{text-align:left;flex:1}
.var-km{font-size:10px;display:block;margin-top:1px;font-weight:400}
.eye-btn{font-size:13px;line-height:1;padding:1px 2px;border-radius:3px;flex-shrink:0;opacity:.45;transition:.15s}
.eye-btn:hover{opacity:1}

/* Empty state */
.empty-hint{text-align:center;padding:28px 16px;font-size:12px;color:var(--text-2);line-height:1.7}
.empty-hint .ico{font-size:26px;display:block;margin-bottom:8px;opacity:.7}

/* ── INFO BAR ── */
#info-bar{position:fixed;bottom:12px;left:12px;width:fit-content;max-width:calc(100vw - 24px);height:var(--info-bar-h);background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:999px;box-shadow:var(--glass-shadow-sm);display:flex;align-items:center;gap:10px;padding:0 18px;z-index:900;font-size:11.5px;color:var(--text-2);white-space:nowrap}
.info-chip{display:flex;align-items:center;gap:4px}
.info-chip strong{color:var(--text);font-weight:600}
.info-sep{width:1px;height:12px;background:rgba(0,0,0,.1)}
#trace-mode-badge{display:none;align-items:center;gap:6px;background:linear-gradient(180deg, rgba(64,150,255,.95), rgba(0,110,235,.95));color:#fff;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:500;box-shadow:0 1px 6px rgba(0,122,255,.4)}
#trace-mode-badge.show{display:flex}
#trace-mode-badge .pulse{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* ── INSTRUCTION PILL ── */
#instruction{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:var(--glass-bg-strong);border:1px solid var(--glass-border);border-radius:999px;box-shadow:var(--glass-shadow-sm);padding:9px 20px;font-size:12.5px;color:var(--text-2);z-index:850;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none;backdrop-filter:var(--glass-blur-soft);-webkit-backdrop-filter:var(--glass-blur-soft)}
#instruction .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex-shrink:0}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:rgba(150,170,220,.25);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px)}
#loader.show{display:flex}
.loader-card{background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);padding:18px 24px;display:flex;align-items:center;gap:12px;border:1px solid var(--glass-border)}
.loader-card span{font-size:13px;color:var(--text-2);font-weight:500}
.spinner{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.08);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── EXPORT MENU ── */
.export-wrap{position:relative}
.export-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-md);box-shadow:var(--glass-shadow);padding:6px;min-width:270px;z-index:1200;display:none}
.export-menu.show{display:block}
.export-menu button{display:flex;flex-direction:column;width:100%;text-align:left;padding:9px 12px;border:none;background:transparent;font-size:13px;color:var(--text);border-radius:10px;cursor:pointer;font-family:inherit;transition:.12s}
.export-menu button:hover{background:rgba(255,255,255,.6)}
.export-menu .menu-sub{font-size:11px;color:var(--text-2);margin-top:2px;font-weight:400}
.export-menu .menu-divider{height:1px;background:rgba(0,0,0,.08);margin:5px 4px}

/* ── BASEMAP ── */
#basemap-ctrl{position:fixed;left:calc(var(--panel-w) + 26px);bottom:calc(var(--info-bar-h) + 24px);z-index:850;display:flex;background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:999px;box-shadow:var(--glass-shadow-sm);padding:3px;border:1px solid var(--glass-border)}
#basemap-ctrl button{border:none;background:transparent;font-size:11.5px;font-weight:500;color:var(--text-2);padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s}
#basemap-ctrl button.active{background:linear-gradient(180deg, rgba(64,150,255,.95), rgba(0,110,235,.95));color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.4)}

/* ── REGLA ── */
#ruler-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:700;display:none;cursor:crosshair}
#ruler-overlay.show{display:block}
#ruler-banner{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.6);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:9px 20px;font-size:12.5px;font-weight:500;z-index:1050;display:none;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);white-space:nowrap}
#ruler-banner.show{display:flex}
#ruler-banner .ruler-pulse{width:6px;height:6px;border-radius:50%;background:#007aff;animation:pulse 1.2s ease-in-out infinite}
#ruler-clear-btn{color:#fff;cursor:pointer;text-decoration:underline;background:none;border:none;font-size:12.5px;font-weight:500;pointer-events:all}
#ruler-total-display{position:fixed;right:24px;bottom:calc(var(--info-bar-h) + 24px);z-index:850;background:var(--glass-bg-strong);backdrop-filter:var(--glass-blur-soft);-webkit-backdrop-filter:var(--glass-blur-soft);border-radius:999px;box-shadow:var(--glass-shadow-sm);padding:7px 14px;font-size:12px;color:var(--text-2);display:none;border:1px solid var(--glass-border)}
#ruler-total-display.show{display:block}
#ruler-total-display strong{color:var(--text)}
.ruler-tooltip{background:rgba(28,28,30,.75) !important;backdrop-filter:blur(10px);color:#fff !important;border:none !important;font-size:11.5px !important;font-weight:600;padding:3px 8px !important;border-radius:6px !important}
.ruler-tooltip::before{display:none !important}
.ruler-total-tip{background:#007aff !important}

/* ── Leaflet controls glass touch ── */
.leaflet-control-zoom{border:1px solid var(--glass-border) !important;border-radius:999px !important;overflow:hidden;box-shadow:var(--glass-shadow-sm) !important}
.leaflet-control-zoom a{background:var(--glass-bg-strong) !important;backdrop-filter:var(--glass-blur-soft);-webkit-backdrop-filter:var(--glass-blur-soft);color:var(--text) !important;border:none !important}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.85) !important}
.leaflet-control-attribution{background:rgba(255,255,255,.5) !important;backdrop-filter:blur(6px);border-radius:8px 0 0 0}
</style>
</head>
<body>

<header id="app-header">
  <div class="header-left">
    <div class="breadcrumb">
      <a href="paraderoscore.html">‹ ParaderosCore</a>
    </div>
    <div class="header-divider"></div>
    <div class="logo">Ruta<span>Core</span></div>
  </div>
  <div class="header-right">
    <span class="status-pill" id="status-pill">Sin red vial</span>
    <input type="file" id="file-red" accept=".zip,.geojson,.json,.kml,.kmz">
    <button class="btn primary" id="btn-load-red"><i class="fa-solid fa-map"></i> Cargar red</button>
    <div class="btn-group">
      <button class="btn" id="btn-trace" disabled title="Trazar ruta sobre la red"><i class="fa-solid fa-pen"></i> Trazar</button>
      <button class="btn" id="btn-delete-seg" disabled title="Eliminar segmentos"><i class="fa-solid fa-scissors"></i> Eliminar</button>
      <button class="btn" id="btn-undo" disabled title="Deshacer"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="btn" id="btn-redo" disabled title="Rehacer"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="btn" id="btn-ruler" disabled title="Regla de medición"><i class="fa-solid fa-ruler"></i> Regla</button>
    </div>
    <div class="btn-group">
      <button class="btn" id="btn-edit-network" disabled title="Editar la red vial: agregar o eliminar tramos"><i class="fa-solid fa-wrench"></i> Editar red</button>
      <button class="btn" id="btn-edit-delete" disabled title="Eliminar un tramo existente de la red"><i class="fa-solid fa-scissors"></i> Borrar tramo</button>
      <button class="btn" id="btn-edit-draw" disabled title="Dibujar tramo nuevo (clic, clic… Esc o doble clic para terminar)"><i class="fa-solid fa-plus"></i> Dibujar tramo</button>
      <button class="btn" id="btn-save-chain" disabled title="Guardar el tramo dibujado y seguir agregando más, sin salir del modo dibujo"><i class="fa-solid fa-floppy-disk"></i> Guardar tramo</button>
    </div>
    <input type="file" id="file-session" accept=".json" style="display:none">
    <button class="btn" id="btn-load-session"><i class="fa-solid fa-folder-open"></i> Sesión</button>
    <div class="export-wrap">
      <button class="btn" id="btn-export" disabled>Exportar ▾</button>
      <div class="export-menu" id="export-menu">
        <button id="export-geojson"><i class="fa-solid fa-route"></i> Exportar rutas GeoJSON<span class="menu-sub">.geojson — compatible con ClasificadorVial</span></button>
        <button id="export-red"><i class="fa-solid fa-road"></i> Exportar red vial GeoJSON<span class="menu-sub">.geojson — red completa con tus ediciones (QGIS)</span></button>
        <div class="menu-divider"></div>
        <button id="export-session"><i class="fa-solid fa-floppy-disk"></i> Guardar sesión<span class="menu-sub">.json — red + todas las rutas</span></button>
      </div>
    </div>
  </div>
</header>

<aside id="panel">
  <div class="panel-top">
    <div class="panel-top-header">
      <div class="panel-section-icon"><i class="fa-solid fa-bus"></i></div>
      <span class="panel-top-title">Gestión de rutas</span>
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.10.0/dist/proj4.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/togeojson@0.16.0/togeojson.js"></script>
<script>
'use strict';
const el = id => document.getElementById(id);

/* ── MAPA ── */
// Nota: CARTO (basemaps.cartocdn.com) empezó a exigir API key para uso anónimo
// desde fines de agosto 2026 — sin key tapa el mapa con la marca "API KEY REQUIRED".
// tile.openstreetmap.org directamente bloquea (403) a apps que no cumplan su política
// de uso — no está pensado para consumo desde una app, solo para pruebas puntuales.
// Claro/Oscuro/Satélite usan ArcGIS (gratis, sin key). "Calles" usa MapTiler porque es
// el que realmente se ve como el OSM clásico — necesita una API key gratuita:
// 1. Andá a https://www.maptiler.com/cloud/ y create una cuenta (no pide tarjeta)
// 2. Copiá tu API key desde el dashboard
// 3. Pegala acá abajo, reemplazando el texto entre comillas:
const MAPTILER_KEY='1bn01ccw92pBVsN2xVIz';
// maxNativeZoom = hasta qué nivel de zoom existen tiles reales en ese proveedor; más allá,
// Leaflet estira la última imagen disponible en vez de mostrar el tile vacío de "no data".
const TILES={
  claro:{
    urls:[
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'
    ],
    maxNativeZoom:16,
    attribution:'© OpenStreetMap contributors, © Esri'
  },
  oscuro:{
    urls:[
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}'
    ],
    maxNativeZoom:16,
    attribution:'© OpenStreetMap contributors, © Esri'
  },
  satelite:{
    urls:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
    maxNativeZoom:19,
    attribution:'© OpenStreetMap contributors, © Esri'
  },
  osm:{
    urls:[`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`],
    maxNativeZoom:20,
    attribution:'© OpenStreetMap contributors, © MapTiler',
    needsKey:true
  }
};
const map=L.map('map',{zoomControl:false}).setView([-9.19,-75.015],6);
let baseTileLayers=[]; // 1 o 2 capas activas, según el basemap (algunos van con capa de referencia aparte)
function setBasemap(k){
  const cfg=TILES[k];
  if(cfg.needsKey&&MAPTILER_KEY==='PEGA_TU_API_KEY_AQUI'){
    alert('Este mapa ("Calles") necesita tu API key gratuita de MapTiler.\n\n1. Creá una cuenta en maptiler.com/cloud (no pide tarjeta)\n2. Copiá tu API key\n3. En el código, buscá MAPTILER_KEY y pegala ahí\n\nMientras tanto, quedate con Claro, Oscuro o Satélite.');
    return;
  }
  baseTileLayers.forEach(l=>map.removeLayer(l));
  baseTileLayers=[];
  cfg.urls.forEach((url,i)=>{
    const layer=L.tileLayer(url,{
      maxZoom:20,                      // hasta acá el usuario puede seguir haciendo zoom en pantalla
      maxNativeZoom:cfg.maxNativeZoom,  // hasta acá existen tiles reales — de ahí en más, Leaflet estira el último
      attribution:i===0?cfg.attribution:undefined
    }).addTo(map);
    baseTileLayers.push(layer);
  });
  ['claro','oscuro','satelite','osm'].forEach(j=>el('bm-'+j).classList.toggle('active',j===k));
}
setBasemap('claro');
['claro','oscuro','satelite','osm'].forEach(k=>{
  el('bm-'+k).addEventListener('click',()=>setBasemap(k));
});

/* ── UTM → WGS84 ── */
proj4.defs('EPSG:32717','+proj=utm +zone=17 +south +datum=WGS84 +units=m +no_defs');
proj4.defs('EPSG:32718','+proj=utm +zone=18 +south +datum=WGS84 +units=m +no_defs');
proj4.defs('EPSG:32719','+proj=utm +zone=19 +south +datum=WGS84 +units=m +no_defs');
function findFirstCoord(geom){if(!geom)return null;let c=geom.coordinates;while(Array.isArray(c)&&Array.isArray(c[0]))c=c[0];return(Array.isArray(c)&&typeof c[0]==='number')?c:null;}
function transformCoords(coords,fn){if(typeof coords[0]==='number')return fn(coords);return coords.map(c=>transformCoords(c,fn));}
function reprojectGeoJSON(gj,fromEPSG){
  const fn=xy=>proj4(fromEPSG,'EPSG:4326',xy);
  function walkGeom(g){if(!g)return;if(g.type==='GeometryCollection'){g.geometries.forEach(walkGeom);return;}if(g.coordinates)g.coordinates=transformCoords(g.coordinates,fn);}
  if(gj.features)gj.features.forEach(f=>walkGeom(f.geometry));else if(gj.geometry)walkGeom(gj.geometry);
  return gj;
}
function detectCRS(gj){const name=gj&&gj.crs&&gj.crs.properties&&gj.crs.properties.name;if(!name)return null;const m=String(name).match(/EPSG:{1,2}(\d+)/i);return m?'EPSG:'+m[1]:null;}
const PERU_BBOX={lonMin:-82,lonMax:-68,latMin:-19.5,latMax:1};
function detectUTM(xy){for(const e of['EPSG:32717','EPSG:32718','EPSG:32719']){try{const[lon,lat]=proj4(e,'EPSG:4326',xy);if(lon>=PERU_BBOX.lonMin&&lon<=PERU_BBOX.lonMax&&lat>=PERU_BBOX.latMin&&lat<=PERU_BBOX.latMax)return e;}catch(_){}}return null;}

/* ── LECTOR ARCHIVOS GEO ── */
async function readGeoFile(file){
  const name=file.name.toLowerCase();
  let gj=null;
  if(name.endsWith('.zip')){
    const buf=await file.arrayBuffer();
    gj=await shp(buf);
    if(!gj)throw new Error('No se pudo leer el ZIP/Shapefile.');
    if(Array.isArray(gj))gj={type:'FeatureCollection',features:gj.flatMap(g=>g.features||[])};
  }else if(name.endsWith('.kmz')){
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const kmlFile=Object.values(zip.files).find(f=>f.name.toLowerCase().endsWith('.kml'));
    if(!kmlFile)throw new Error('No se encontró KML dentro del KMZ.');
    gj=toGeoJSON.kml(new DOMParser().parseFromString(await kmlFile.async('text'),'text/xml'));
  }else if(name.endsWith('.kml')){
    gj=toGeoJSON.kml(new DOMParser().parseFromString(await file.text(),'text/xml'));
  }else{
    gj=JSON.parse(await file.text());
  }
  if(!gj)throw new Error('Formato no reconocido.');
  if(!gj.features)gj={type:'FeatureCollection',features:[gj]};
  let crs=detectCRS(gj);
  if(!crs){
    const sample=gj.features.find(f=>f.geometry);
    if(sample){const xy=findFirstCoord(sample.geometry);if(xy&&(Math.abs(xy[0])>360||Math.abs(xy[1])>90))crs=detectUTM(xy);}
  }
  if(crs&&crs!=='EPSG:4326')gj=reprojectGeoJSON(gj,crs);
  return gj;
}

/* ── ESTADO GLOBAL ── */
let redFeatures=[];
let redLayer=null;
let redRenderer=null; // lienzo de la red: se elimina al redibujar, si no se acumulan lienzos y el navegador se queda sin memoria
let segIndex=[];          // [{fi, segId, latlngs, midLat, midLng, layer}]
let segIndexById=new Map(); // segId → entrada de segIndex, acceso O(1) en vez de recorrer el array

/* ── ID ESTABLE POR GEOMETRÍA ──
   En vez de un contador correlativo (que se reordena cada vez que se
   re-renderiza la red), el segId se deriva de las coordenadas del propio
   segmento (inicio, punto medio, fin). Así, un tramo que no cambió conserva
   el MISMO segId aunque se agreguen, borren o reordenen otros tramos de la
   red — clave para poder editar la red sin romper rutas ya trazadas. */
function segIdFromLatLngs(latlngs){
  if(!latlngs||latlngs.length<2)return null;
  const r=n=>n.toFixed(6);
  const a=latlngs[0], b=latlngs[latlngs.length-1], m=latlngs[Math.floor(latlngs.length/2)];
  return `${r(a[0])},${r(a[1])}|${r(m[0])},${r(m[1])}|${r(b[0])},${r(b[1])}`;
}
function isOldNumericSegId(id){return typeof id==='number'||(typeof id==='string'&&/^\d+$/.test(id));}

let routes=[];            // [{id, nombre, color, vis, visIda, visVuelta, ida:[{segId}], vuelta:[{segId}]}]
let activeRouteId=null;
let activeVariant='ida';  // 'ida' | 'vuelta'

let traceMode=false;
let deleteMode=false;

let undoStack=[];         // [{routeId, variant, segId, action:'add'|'delete'}]
let redoStack=[];
const MAX_UNDO=50;

/* ── EDICIÓN DE RED ── */
let editNetworkMode=false;
let netTool=null;              // 'delete' | 'draw' | null
let nodeIndex=[];              // [[lat,lng], ...] — extremos de todos los tramos, para snap
let drawChain=[];              // puntos ya colocados en el tramo que se está dibujando
let drawChainVisualLines=[];
let drawChainVisualMarkers=[];
let pendingNewFeatures=[];     // features GeoJSON del tramo en curso, aún no confirmadas
let snapHighlight=null;
const SNAP_PX=18;              // tolerancia de enganche a un nodo existente, en píxeles de pantalla

const PALETTE=['#7c3aed','#e2483d','#0891b2','#16a34a','#d97706','#db2777','#0066cc','#9d174d'];
let paletteIdx=0;

/* ── UTILIDADES ── */
function showLoader(t){el('loader-text').textContent=t;el('loader').classList.add('show');}
function hideLoader(){el('loader').classList.remove('show');}
function setInstruction(txt){el('instruction-text').textContent=txt;}
function downloadText(fn,text){const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([text],{type:'application/json'})),download:fn});document.body.appendChild(a);a.click();document.body.removeChild(a);}

function haversineKm(a,b){
  const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
  const la=a[0]*Math.PI/180,lb=b[0]*Math.PI/180;
  return R*2*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)**2));
}
function segmentKm(latlngs){let d=0;for(let i=1;i<latlngs.length;i++)d+=haversineKm(latlngs[i-1],latlngs[i]);return d;}
function variantKm(routeId,variant){
  const r=routes.find(x=>x.id===routeId);if(!r)return 0;
  return r[variant].reduce((acc,s)=>{const si=segIndexById.get(s.segId);return acc+(si?segmentKm(si.latlngs):0);},0);
}
function fmtKm(km){return km.toFixed(2)+' km';}

function adjustColor(hex,amt){
  const c=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,((c>>16)&0xff)+amt));
  const g=Math.max(0,Math.min(255,((c>>8)&0xff)+amt));
  const b=Math.max(0,Math.min(255,(c&0xff)+amt));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

/* ── RENDER RED ── */
function renderRed(){
  if(redLayer){map.removeLayer(redLayer);redLayer=null;}
  segIndex=[];
  // Quitar el lienzo anterior: quitar la capa no lo elimina, y cada redibujado dejaba uno
  // más en el mapa (memoria gráfica creciente → "Aw, Snap" tras varios cambios de red).
  if(redRenderer){map.removeLayer(redRenderer);redRenderer=null;}
  const renderer=L.canvas({padding:0.5});
  redRenderer=renderer;
  // La red no es interactiva (clic y hover van por el índice espacial), pero el canvas de
  // Leaflet igual recorre todos sus tramos en cada movimiento del mouse buscando uno
  // "interactivo". Con 50 000 tramos eso es lo que causaba los tirones: se desactiva.
  renderer._handleMouseHover=function(e){this._fireEvent(false,e);}; // el mousemove sigue llegando al mapa
  renderer._onClick=function(e){this._fireEvent(false,e);}; // el clic sigue llegando al mapa
  const usedIds=new Map(); // detecta colisiones (dos tramos con mismo inicio/medio/fin) y las desambigua
  const siByFi=new Map();  // fi → entrada de segIndex, para no tener que buscar (evita O(n²))

  // Capa visual — delgada, solo para ver
  let fiCounter=-1;
  redLayer=L.geoJSON({type:'FeatureCollection',features:redFeatures},{
    renderer,
    style:()=>({color:'#8e8e93',weight:2,opacity:0.5,interactive:false}),
    onEachFeature:(feature,layer)=>{
      const fi=++fiCounter; // mismo orden en que Leaflet recorre redFeatures — reemplaza indexOf(feature)
      let coords=[];
      const g=feature.geometry;
      if(g.type==='LineString')coords=g.coordinates;
      else if(g.type==='MultiLineString')coords=g.coordinates[0]||[];
      const latlngs=coords.map(c=>[c[1],c[0]]);
      if(!latlngs.length)return;
      let segId=segIdFromLatLngs(latlngs);
      if(segId===null)return;
      if(usedIds.has(segId)){
        const n=usedIds.get(segId)+1; usedIds.set(segId,n);
        segId=segId+'#'+n;
      }else usedIds.set(segId,0);
      const mid=latlngs[Math.floor(latlngs.length/2)];
      const entry={fi,segId,latlngs,midLat:mid[0],midLng:mid[1],layer,_sk:'#8e8e93|2|0.5'};
      segIndex.push(entry);
      siByFi.set(fi,entry);
    }
  }).addTo(map);

  // (Antes había una segunda capa invisible y gruesa para capturar clics y hover.
  //  Ahora los clics y el hover se resuelven con un índice espacial: la red se dibuja
  //  una sola vez y el mouse ya no obliga a revisar todos los tramos.)

  // Índice de nodos (extremos de cada tramo) para el snap del modo "Dibujar tramo"
  // + mapa segId → entrada, para no recorrer segIndex entero cada vez que se busca un segmento
  nodeIndex=[];
  segIndexById=new Map();
  segIndex.forEach(si=>{
    nodeIndex.push(si.latlngs[0]);
    nodeIndex.push(si.latlngs[si.latlngs.length-1]);
    segIndexById.set(si.segId,si);
  });
  hoverSi=null;
  buildSpatialIndex();
}

/* ── ÍNDICE ESPACIAL ──
   La red se reparte en una grilla de celdas (~165 m). Para saber qué tramo está bajo el
   mouse, o a qué nodo engancha el modo Dibujar, solo se revisan las celdas cercanas
   (unas decenas de tramos) en vez de toda la red. */
const GRID_CELL=0.0015;
const HIT_PX=8;            // tolerancia de clic/hover sobre un tramo, en píxeles
let segGrid=new Map(), nodeGrid=new Map(), redBounds=null;
const gridKey=(x,y)=>x*100000+y;
function gridAdd(grid,k,v){let a=grid.get(k);if(!a){a=[];grid.set(k,a);}if(a[a.length-1]!==v)a.push(v);}
function buildSpatialIndex(){
  segGrid=new Map(); nodeGrid=new Map();
  let minLat=Infinity,minLng=Infinity,maxLat=-Infinity,maxLng=-Infinity;
  segIndex.forEach(si=>{
    const ll=si.latlngs;
    for(let i=0;i<ll.length;i++){
      const p=ll[i];
      if(p[0]<minLat)minLat=p[0];if(p[0]>maxLat)maxLat=p[0];if(p[1]<minLng)minLng=p[1];if(p[1]>maxLng)maxLng=p[1];
      if(i===ll.length-1)break;
      const q=ll[i+1];
      const x0=Math.floor(Math.min(p[1],q[1])/GRID_CELL),x1=Math.floor(Math.max(p[1],q[1])/GRID_CELL);
      const y0=Math.floor(Math.min(p[0],q[0])/GRID_CELL),y1=Math.floor(Math.max(p[0],q[0])/GRID_CELL);
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)gridAdd(segGrid,gridKey(x,y),si);
    }
  });
  nodeIndex.forEach(n=>gridAdd(nodeGrid,gridKey(Math.floor(n[1]/GRID_CELL),Math.floor(n[0]/GRID_CELL)),n));
  redBounds=segIndex.length?L.latLngBounds([minLat,minLng],[maxLat,maxLng]):null;
}
// Celdas que cubren un cuadrado de ±tol píxeles alrededor de un punto de pantalla
function gridCellsAround(pt,tol){
  const c1=map.containerPointToLatLng([pt.x-tol,pt.y-tol]),c2=map.containerPointToLatLng([pt.x+tol,pt.y+tol]);
  const x0=Math.floor(Math.min(c1.lng,c2.lng)/GRID_CELL),x1=Math.floor(Math.max(c1.lng,c2.lng)/GRID_CELL);
  const y0=Math.floor(Math.min(c1.lat,c2.lat)/GRID_CELL),y1=Math.floor(Math.max(c1.lat,c2.lat)/GRID_CELL);
  if((x1-x0+1)*(y1-y0+1)>900)return null; // zoom demasiado alejado para elegir un tramo
  const keys=[];for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)keys.push(gridKey(x,y));
  return keys;
}
function nearestSegAt(pt,tol){
  const keys=gridCellsAround(pt,tol);if(!keys)return null;
  const vistos=new Set();let best=null,minD=tol;
  keys.forEach(k=>{
    const arr=segGrid.get(k);if(!arr)return;
    for(const si of arr){
      if(vistos.has(si))continue;vistos.add(si);
      const ll=si.latlngs;let a=map.latLngToContainerPoint(ll[0]);
      for(let i=1;i<ll.length;i++){
        const b=map.latLngToContainerPoint(ll[i]);
        const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
        const t=len2===0?0:Math.max(0,Math.min(1,((pt.x-a.x)*dx+(pt.y-a.y)*dy)/len2));
        const d=Math.hypot(pt.x-a.x-t*dx,pt.y-a.y-t*dy);
        if(d<minD){minD=d;best=si;}
        a=b;
      }
    }
  });
  return best;
}
function nearestNodeAt(pt,tol){
  const keys=gridCellsAround(pt,tol);if(!keys)return null;
  let best=null,minD=tol;
  keys.forEach(k=>{
    const arr=nodeGrid.get(k);if(!arr)return;
    arr.forEach(n=>{const np=map.latLngToContainerPoint(n);const d=Math.hypot(pt.x-np.x,pt.y-np.y);if(d<minD){minD=d;best=n;}});
  });
  return best;
}

/* ── ESTILO CON CACHÉ ── solo se redibuja un tramo si su estilo cambió de verdad */
function setSegStyle(si,st){
  const k=st.color+'|'+st.weight+'|'+st.opacity;
  if(si._sk===k)return;
  si._sk=k; si.layer.setStyle(st);
}

/* ── CLIC Y HOVER SOBRE LA RED ── (reemplazan a los eventos de la capa invisible) */
let hoverSi=null,hoverRaf=0,hoverPt=null;
const hoverActivo=()=>traceMode||netTool==='delete';
function setHoverSeg(si){
  if(si===hoverSi)return;
  const prev=hoverSi;hoverSi=si;
  if(prev&&segIndexById.get(prev.segId)===prev)setSegStyle(prev,segmentBaseStyle(prev.segId));
  if(si)setSegStyle(si,netTool==='delete'?{color:'#e2483d',weight:3.5,opacity:1}:{color:'#007aff',weight:3.5,opacity:1});
}
map.on('mousemove',e=>{
  if(!hoverActivo()){if(hoverSi)setHoverSeg(null);return;}
  hoverPt=e.containerPoint;
  if(!hoverRaf)hoverRaf=requestAnimationFrame(()=>{hoverRaf=0;if(hoverActivo())setHoverSeg(nearestSegAt(hoverPt,HIT_PX));});
});
map.getContainer().addEventListener('mouseleave',()=>setHoverSeg(null));
map.on('click',e=>{
  if(netTool==='draw'||!hoverActivo())return; // el modo Dibujar tiene su propio clic
  const si=nearestSegAt(e.containerPoint,HIT_PX);if(!si)return;
  if(netTool==='delete'){setHoverSeg(null);handleNetworkDeleteClick(si.segId);return;}
  handleSegmentClick(si.segId);
});

function styleFromCandidates(candidates){
  if(!candidates||!candidates.length) return {color:'#8e8e93',weight:2,opacity:0.5};
  // Prioridad: 1) variante activa visible, 2) cualquier visible, 3) gris
  const activeVisible=candidates.find(c=>c.isActive&&c.vis);
  if(activeVisible) return {color:activeVisible.color,weight:activeVisible.weight,opacity:activeVisible.opacity};
  const anyVisible=candidates.find(c=>c.vis);
  if(anyVisible) return {color:anyVisible.color,weight:anyVisible.weight,opacity:anyVisible.opacity};
  return {color:'#8e8e93',weight:2,opacity:0.5};
}
function segmentBaseStyle(segId){
  // Para consultas puntuales de UN segmento (ej. al agregar/quitar uno solo en modo trazar).
  // Para refrescar TODA la red de una — ver refreshAllStyles, que arma esto mismo en un solo recorrido.
  const candidates=[];
  for(const r of routes){
    if(r.ida.find(s=>s.segId===segId)){
      const vis=r.vis!==false&&r.visIda!==false;
      candidates.push({vis,color:r.color,weight:3.5,opacity:0.9,isActive:r.id===activeRouteId&&activeVariant==='ida'});
    }
    if(r.vuelta.find(s=>s.segId===segId)){
      const vis=r.vis!==false&&r.visVuelta!==false;
      candidates.push({vis,color:adjustColor(r.color,-40),weight:3.5,opacity:0.9,isActive:r.id===activeRouteId&&activeVariant==='vuelta'});
    }
  }
  return styleFromCandidates(candidates);
}
function refreshSegmentStyle(segId){const si=segIndexById.get(segId);if(si)setSegStyle(si,segmentBaseStyle(segId));}
function refreshAllStyles(){
  // Antes: por cada segmento de la red, recorría TODAS las rutas buscando si lo contenían
  // (segmentos × rutas × largo de cada ruta) — con red y rutas grandes se sentía pesado.
  // Ahora: un solo recorrido de las rutas arma quién le pertenece a cada segmento,
  // y después un solo recorrido de la red aplica el estilo ya resuelto.
  const candidatesBySeg=new Map();
  routes.forEach(r=>{
    const visBase=r.vis!==false;
    r.ida.forEach(s=>{
      const arr=candidatesBySeg.get(s.segId)||[];
      arr.push({vis:visBase&&r.visIda!==false,color:r.color,weight:3.5,opacity:0.9,isActive:r.id===activeRouteId&&activeVariant==='ida'});
      candidatesBySeg.set(s.segId,arr);
    });
    r.vuelta.forEach(s=>{
      const arr=candidatesBySeg.get(s.segId)||[];
      arr.push({vis:visBase&&r.visVuelta!==false,color:adjustColor(r.color,-40),weight:3.5,opacity:0.9,isActive:r.id===activeRouteId&&activeVariant==='vuelta'});
      candidatesBySeg.set(s.segId,arr);
    });
  });
  segIndex.forEach(si=>setSegStyle(si,styleFromCandidates(candidatesBySeg.get(si.segId))));
}

/* ── CLIC EN SEGMENTO ── */
function handleSegmentClick(segId){
  if(!traceMode)return;
  if(!activeRouteId){alert('Seleccioná una ruta en el panel izquierdo.');return;}
  const r=routes.find(x=>x.id===activeRouteId);if(!r)return;
  const varArr=r[activeVariant];

  if(deleteMode){
    const idx=varArr.findIndex(s=>s.segId===segId);
    if(idx===-1){setInstruction('Ese segmento no está en la variante activa.');return;}
    varArr.splice(idx,1);
    pushUndo({routeId:activeRouteId,variant:activeVariant,segId,action:'delete'});
    refreshSegmentStyle(segId);updateInfoBar();renderRoutesPanel();
    setInstruction('Segmento eliminado. Podés deshacer con el botón de la barra.');
    return;
  }
  if(varArr.find(s=>s.segId===segId)){setInstruction('Segmento ya está en esta variante.');return;}
  varArr.push({segId});
  pushUndo({routeId:activeRouteId,variant:activeVariant,segId,action:'add'});
  refreshSegmentStyle(segId);updateInfoBar();renderRoutesPanel();
  setInstruction(`Agregado a "${r.nombre}" — ${activeVariant}. (${varArr.length} segs)`);
}

function pushUndo(entry){
  if(undoStack.length>=MAX_UNDO)undoStack.shift();
  undoStack.push(entry);
  redoStack=[];
  el('btn-undo').disabled=false;
  el('btn-redo').disabled=true;
}

/* ── Borrar tramo existente ── */
function handleNetworkDeleteClick(segId){
  const si=segIndexById.get(segId);
  if(!si)return;
  const afectadas=[];
  routes.forEach(r=>{
    if(r.ida.find(s=>s.segId===segId))afectadas.push(`${r.nombre} (ida)`);
    if(r.vuelta.find(s=>s.segId===segId))afectadas.push(`${r.nombre} (vuelta)`);
  });
  const msg=afectadas.length
    ?`Este tramo es usado por: ${afectadas.join(', ')}.\n\nSe eliminará de la red y también se quitará de esas rutas (su distancia se recalcula sola). ¿Confirmás?`
    :'¿Confirmás eliminar este tramo de la red?';
  if(!confirm(msg))return;

  showLoader('Eliminando tramo…');
  setTimeout(()=>{
    redFeatures=redFeatures.filter((f,idx)=>idx!==si.fi);
    routes.forEach(r=>{
      r.ida=r.ida.filter(s=>s.segId!==segId);
      r.vuelta=r.vuelta.filter(s=>s.segId!==segId);
    });
    undoStack=[];redoStack=[];el('btn-undo').disabled=true;el('btn-redo').disabled=true;

    renderRed();
    refreshAllStyles();
    renderRoutesPanel();updateInfoBar();
    el('status-pill').textContent=`${redFeatures.length.toLocaleString('es-PE')} segmentos`;
    hideLoader();
    setInstruction(afectadas.length
      ?`Tramo eliminado — rutas actualizadas: ${afectadas.join(', ')}.`
      :'Tramo eliminado de la red.');
  },30);
}

/* ── Dibujar tramo nuevo (encadenado, con snap a nodos existentes) ── */
function findSnapNode(latlngObj){
  const mp=map.latLngToContainerPoint(latlngObj);
  let nearest=nearestNodeAt(mp,SNAP_PX);
  let minD=nearest?Math.hypot(mp.x-map.latLngToContainerPoint(nearest).x,mp.y-map.latLngToContainerPoint(nearest).y):SNAP_PX;
  drawChain.forEach(pt=>{
    const np=map.latLngToContainerPoint(pt);
    const d=Math.hypot(mp.x-np.x,mp.y-np.y);
    if(d<minD){minD=d;nearest=[pt.lat,pt.lng];}
  });
  return nearest;
}
function updateSnapHighlight(node){
  if(snapHighlight){map.removeLayer(snapHighlight);snapHighlight=null;}
  if(node)snapHighlight=L.circleMarker(node,{radius:9,color:'#16a34a',weight:3,fillColor:'#fff',fillOpacity:0.95,interactive:false}).addTo(map);
}
function addChainPoint(latlng){
  const ll=L.latLng(latlng[0],latlng[1]);
  if(drawChain.length){
    const prev=drawChain[drawChain.length-1];
    const line=L.polyline([prev,ll],{color:'#16a34a',weight:3,dashArray:'5 4',interactive:false}).addTo(map);
    drawChainVisualLines.push(line);
    pendingNewFeatures.push({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[[prev.lng,prev.lat],[ll.lng,ll.lat]]}});
  }
  const marker=L.circleMarker(ll,{radius:4,color:'#16a34a',fillColor:'#fff',fillOpacity:1,weight:2,interactive:false}).addTo(map);
  drawChainVisualMarkers.push(marker);
  drawChain.push(ll);
}
function clearChainVisuals(){
  drawChainVisualLines.forEach(l=>map.removeLayer(l));drawChainVisualLines=[];
  drawChainVisualMarkers.forEach(m=>map.removeLayer(m));drawChainVisualMarkers=[];
}
function finishChain(){
  const nSegs=pendingNewFeatures.length;
  const featsToAdd=pendingNewFeatures;
  pendingNewFeatures=[];
  clearChainVisuals();
  drawChain=[];
  updateSnapHighlight(null);
  if(!nSegs){
    if(netTool==='draw')setInstruction('Clic para agregar puntos · doble clic, Esc o el botón Guardar tramo para terminar.');
    return;
  }
  showLoader('Guardando tramo…');
  setTimeout(()=>{
    redFeatures=redFeatures.concat(featsToAdd);
    undoStack=[];redoStack=[];el('btn-undo').disabled=true;el('btn-redo').disabled=true;
    renderRed();
    refreshAllStyles();
    renderRoutesPanel();updateInfoBar();
    el('status-pill').textContent=`${redFeatures.length.toLocaleString('es-PE')} segmentos`;
    hideLoader();
    if(netTool==='draw')setInstruction(`Tramo agregado (${nSegs} seg.). Clic para uno nuevo, o salí con el botón Dibujar tramo.`);
  },30);
}
function drawModeClick(latlngObj){
  const snap=findSnapNode(latlngObj);
  addChainPoint(snap?snap:[latlngObj.lat,latlngObj.lng]);
  updateSnapHighlight(null);
}
map.on('click',e=>{
  if(netTool!=='draw')return;
  drawModeClick(e.latlng);
});
map.on('dblclick',e=>{
  if(netTool!=='draw')return;
  finishChain();
});
map.on('mousemove',e=>{
  if(netTool!=='draw')return;
  updateSnapHighlight(findSnapNode(e.latlng));
});
document.addEventListener('keydown',e=>{

});

    inp.addEventListener('change',()=>{const r=routes.find(x=>x.id===inp.dataset.rid);if(r){r.nombre=inp.value.trim()||r.nombre;renderRoutesPanel();updateInfoBar();}});

      r[vk]=(r[vk]===false);
      refreshAllStyles();renderRoutesPanel();
    });
  });
  list.querySelectorAll('.var-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{if(e.target.closest('.eye-btn'))return;e.stopPropagation();selectRoute(btn.dataset.rid,btn.dataset.var);});
  });
}

/* ── BOTONES HEADER ── */
el('btn-load-red').addEventListener('click',()=>el('file-red').click());
/* ── PREPARAR RED VIAL (exportaciones crudas de OSM) ──
   En OSM una avenida es un "way" que recorre varias cuadras de corrido. En las esquinas
   reales comparte un nodo con la otra calle, pero la línea no está cortada ahí; por eso
   al pintar se tomaba la avenida entera. Al cargar la red:
   1) Las MultiLineString se separan en líneas simples (antes solo se usaba la primera parte).
   2) Si la red es una exportación cruda de OSM (trae el campo "highway"), se quita lo que
      no es vía vehicular: muros, ríos, barreras (sin highway), veredas, peatonales,
      escaleras, accesos de servicio, ciclovías, caminos, vías en construcción y proyectadas.
   3) Cada línea se corta en los vértices que comparte con otra calle (esquinas reales).
      Puentes y pasos a desnivel no comparten nodo con la vía de abajo, así que no se cortan.
   Una red que ya viene cortada en las esquinas (como las de un modelo) queda igual. */
const HIGHWAY_EXCLUIDOS=new Set(['footway','pedestrian','steps','service','path','cycleway','bridleway',
  'corridor','elevator','platform','construction','proposed','abandoned','razed','disused','raceway','bus_stop']);
function prepararRedVial(feats){
  const stats={lineasOriginales:feats.length,quitados:0,esquinas:0,tramos:0,filtroOSM:false};
  // 1) Separar MultiLineString
  let lineas=[];
  feats.forEach(f=>{
    const g=f.geometry,props=f.properties||{};
    const partes=g.type==='MultiLineString'?g.coordinates:[g.coordinates];
    partes.forEach(c=>{if(c&&c.length>=2)lineas.push({props,coords:c});});
  });
  // 2) Filtro OSM: solo si la mayoría de las líneas trae la clave "highway" (exportación cruda)
  const conClave=lineas.filter(l=>'highway' in l.props).length;
  if(conClave>=lineas.length*0.5){
    stats.filtroOSM=true;
    const antes=lineas.length;
    lineas=lineas.filter(l=>{const h=l.props.highway;return h&&!HIGHWAY_EXCLUIDOS.has(String(h).toLowerCase());});
    stats.quitados=antes-lineas.length;
  }
  // 3) Cortar en vértices compartidos entre líneas distintas
  const K=c=>c[0].toFixed(7)+','+c[1].toFixed(7);
  const uso=new Map(); // vértice → id de la primera línea que lo usa, o -1 si lo usan dos o más
  lineas.forEach((l,i)=>{
    l.coords.forEach(c=>{
      const k=K(c),u=uso.get(k);
      if(u===undefined)uso.set(k,i);else if(u!==i&&u!==-1)uso.set(k,-1);
    });
  });
  const out=[];
  lineas.forEach(l=>{
    const c=l.coords;
    const cortes=[0];
    for(let k=1;k<c.length-1;k++) if(uso.get(K(c[k]))===-1) cortes.push(k);
    cortes.push(c.length-1);
    stats.esquinas+=cortes.length-2;
    const dist=+l.props.distance;
    const largoTotal=cortes.length>2&&dist>0?lineLengthM(c):0;
    for(let k=0;k<cortes.length-1;k++){
      const tramo=c.slice(cortes[k],cortes[k+1]+1);
      const props={...l.props};
      if(largoTotal>0) props.distance=dist*lineLengthM(tramo)/largoTotal; // longitud del modelo repartida
      out.push({type:'Feature',properties:props,geometry:{type:'LineString',coordinates:tramo}});
    }
  });
  stats.tramos=out.length;
  return {features:out,stats};
}
function lineLengthM(c){
  let m=0;
  for(let i=1;i<c.length;i++){
    const [lon1,lat1]=c[i-1],[lon2,lat2]=c[i];
    const dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
    const h=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    m+=2*6371008.8*Math.asin(Math.min(1,Math.sqrt(h)));
  }
  return m;
}

el('file-red').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  showLoader('Leyendo red vial…');
  try{
    const gj=await readGeoFile(file);
    const lineas=(gj.features||[]).filter(f=>f.geometry&&(f.geometry.type==='LineString'||f.geometry.type==='MultiLineString'));
    if(!lineas.length)throw new Error('No se encontraron líneas en el archivo.');
    showLoader('Cortando la red en las intersecciones…');
    await new Promise(r=>setTimeout(r,30));
    const {features:prep,stats}=prepararRedVial(lineas);
    if(!prep.length)throw new Error('No quedaron vías después de filtrar el archivo.');
    redFeatures=prep;
    renderRed();
    const bounds=redBounds||L.latLngBounds([]);
    if(bounds.isValid())map.fitBounds(bounds,{padding:[30,30]});
    el('status-pill').textContent=`${redFeatures.length.toLocaleString('es-PE')} segmentos`;
    el('status-pill').classList.add('ok');
    el('btn-load-red').classList.remove('primary');el('btn-load-red').classList.add('loaded');el('btn-load-red').innerHTML='<i class="fa-solid fa-check"></i> Red cargada';
    el('btn-trace').disabled=false;el('btn-delete-seg').disabled=true;
    el('btn-undo').disabled=true;el('btn-redo').disabled=true;el('btn-ruler').disabled=false;
    el('btn-edit-network').disabled=false;
    el('btn-export').disabled=!redFeatures.length;
    el('new-route-name').disabled=false;el('btn-add-route').disabled=false;
    const partes=[];
    if(stats.esquinas) partes.push(`${stats.esquinas.toLocaleString('es-PE')} esquinas cortadas`);
    if(stats.quitados) partes.push(`${stats.quitados.toLocaleString('es-PE')} elementos que no son vías quitados`);
    setInstruction(partes.length
      ?`Red preparada: ${stats.lineasOriginales.toLocaleString('es-PE')} líneas → ${stats.tramos.toLocaleString('es-PE')} tramos (${partes.join(' · ')}) — creá una ruta y empezá a trazar`
      :'Red cargada — creá una ruta en el panel y empezá a trazar');
    renderRoutesPanel();
  }catch(err){alert('Error: '+err.message);}
  hideLoader();e.target.value='';
});

el('btn-trace').addEventListener('click',()=>{
  if(!activeRouteId){alert('Seleccioná o creá una ruta primero.');return;}
  if(traceMode){disableTrace();setInstruction('Modo trazar desactivado.');}
  else enableTrace();
});

el('btn-delete-seg').addEventListener('click',()=>{
  if(!activeRouteId){alert('Seleccioná una ruta primero.');return;}
  if(deleteMode){
    disableDelete();
    setInstruction('Modo eliminar desactivado — volvés a trazar normalmente.');
  }else{
    deleteMode=true;
    el('btn-delete-seg').classList.add('mode-active');
    el('map').classList.remove('cursor-trace');
    el('map').classList.add('cursor-delete');
    setInstruction('Clic sobre un segmento trazado para quitarlo · tocá Eliminar de nuevo para volver a trazar');
  }
});

el('btn-undo').addEventListener('click',()=>{
  if(!traceMode||!undoStack.length)return;
  const entry=undoStack.pop();
  const r=routes.find(x=>x.id===entry.routeId);if(!r)return;
  if(entry.action==='add')r[entry.variant]=r[entry.variant].filter(s=>s.segId!==entry.segId);
  else r[entry.variant].push({segId:entry.segId});
  redoStack.push(entry);
  el('btn-redo').disabled=false;
  if(!undoStack.length)el('btn-undo').disabled=true;
  refreshSegmentStyle(entry.segId);updateInfoBar();renderRoutesPanel();
  setInstruction('Deshacer aplicado.');
});

el('btn-redo').addEventListener('click',()=>{
  if(!traceMode||!redoStack.length)return;
  const entry=redoStack.pop();
  const r=routes.find(x=>x.id===entry.routeId);if(!r)return;
  if(entry.action==='add'){if(!r[entry.variant].find(s=>s.segId===entry.segId))r[entry.variant].push({segId:entry.segId});}
  else r[entry.variant]=r[entry.variant].filter(s=>s.segId!==entry.segId);
  undoStack.push(entry);
  el('btn-undo').disabled=false;
  if(!redoStack.length)el('btn-redo').disabled=true;
  refreshSegmentStyle(entry.segId);updateInfoBar();renderRoutesPanel();
  setInstruction('Rehacer aplicado.');
});

/* ── NUEVA RUTA ── */
el('btn-add-route').addEventListener('click',()=>{
  const nombre=el('new-route-name').value.trim()||`Ruta ${routes.length+1}`;
  const color=el('new-route-color').value;
  const id='r'+Date.now();
  routes.push({id,nombre,color,vis:true,visIda:true,visVuelta:true,ida:[],vuelta:[]});
  el('new-route-name').value='';
  // Avanzar al siguiente color de la paleta
  paletteIdx=(paletteIdx+1)%PALETTE.length;
  el('new-route-color').value=PALETTE[paletteIdx];
  el('btn-export').disabled=false;
  selectRoute(id,'ida');
  renderRoutesPanel();updateInfoBar();
  setInstruction(`Ruta "${nombre}" creada — activá Trazar ruta para empezar`);
});
el('new-route-name').addEventListener('keydown',e=>{if(e.key==='Enter')el('btn-add-route').click();});

/* ── REGLA (modo exclusivo) ── */
let rulerActive=false,rulerPts=[],rulerLines=[],rulerMarkers=[],rulerTotalMarker=null,rulerTotalM=0;
let rulerPrevState={traceMode:false,deleteMode:false};
function formatDist(m){return m>=1000?(m/1000).toFixed(2)+' km':m.toFixed(0)+' m';}

function clearRuler(){
  rulerLines.forEach(l=>map.removeLayer(l));rulerLines=[];
  rulerMarkers.forEach(m=>map.removeLayer(m));rulerMarkers=[];
  if(rulerTotalMarker){map.removeLayer(rulerTotalMarker);rulerTotalMarker=null;}
  rulerPts=[];rulerTotalM=0;
  el('ruler-total-display').classList.remove('show');
}
function enableRuler(){
  rulerPrevState={traceMode,deleteMode};
  rulerActive=true;
  el('btn-trace').disabled=true;el('btn-delete-seg').disabled=true;
  el('btn-undo').disabled=true;el('btn-redo').disabled=true;
  el('btn-edit-network').disabled=true;
  el('btn-ruler').classList.add('mode-active');
  el('ruler-overlay').classList.add('show');
  el('ruler-banner').classList.add('show');
  el('instruction').style.display='none';
}
function disableRuler(){
  rulerActive=false;
  el('ruler-overlay').classList.remove('show');el('ruler-banner').classList.remove('show');
  el('btn-ruler').classList.remove('mode-active');
  el('instruction').style.display='';
  clearRuler();
  el('btn-trace').disabled=!redFeatures.length;
  el('btn-edit-network').disabled=!redFeatures.length;
  if(rulerPrevState.traceMode){
    el('btn-undo').disabled=!undoStack.length;el('btn-redo').disabled=!redoStack.length;
    el('btn-delete-seg').disabled=false;
  }
}
el('btn-ruler').addEventListener('click',()=>{
  if(!redFeatures.length)return;
  rulerActive?disableRuler():enableRuler();
});
el('ruler-clear-btn').addEventListener('click',()=>clearRuler());
el('ruler-overlay').addEventListener('click',e=>{
  if(!rulerActive)return;
  const rect=el('map').getBoundingClientRect();
  const pt=map.containerPointToLatLng(L.point(e.clientX-rect.left,e.clientY-rect.top));
  const ll=[pt.lat,pt.lng];
  if(rulerPts.length){
    const prev=rulerPts[rulerPts.length-1];
    const dist=haversineKm(prev,ll)*1000;
    rulerTotalM+=dist;
    const line=L.polyline([prev,ll],{color:'#1c1c1e',weight:2,dashArray:'5 4',interactive:false}).addTo(map);
    rulerLines.push(line);
    const mid=[(prev[0]+ll[0])/2,(prev[1]+ll[1])/2];
    const lbl=L.circleMarker(mid,{radius:0,opacity:0,fillOpacity:0,interactive:false}).addTo(map)
      .bindTooltip(formatDist(dist),{permanent:true,className:'ruler-tooltip',direction:'top',offset:[0,-4]});
    lbl.openTooltip();rulerMarkers.push(lbl);
    if(rulerTotalMarker)map.removeLayer(rulerTotalMarker);
    rulerTotalMarker=L.circleMarker(ll,{radius:0,opacity:0,fillOpacity:0,interactive:false}).addTo(map)
      .bindTooltip(`Total: ${formatDist(rulerTotalM)}`,{permanent:true,className:'ruler-tooltip ruler-total-tip',direction:'top',offset:[0,-4]});
    rulerTotalMarker.openTooltip();
    el('ruler-dist').textContent=formatDist(rulerTotalM);
    el('ruler-total-display').classList.add('show');
  }
  const vm=L.circleMarker(ll,{radius:4,color:'#1c1c1e',fillColor:'#fff',fillOpacity:1,weight:2,interactive:false}).addTo(map);
  rulerMarkers.push(vm);
  rulerPts.push(ll);
});

/* ── EXPORT ── */
el('btn-export').addEventListener('click',e=>{e.stopPropagation();el('export-menu').classList.toggle('show');});
document.addEventListener('click',e=>{if(e.target.id!=='btn-export'&&!el('export-menu').contains(e.target))el('export-menu').classList.remove('show');});

el('export-geojson').addEventListener('click',()=>{
  el('export-menu').classList.remove('show');
  if(!routes.length){alert('No hay rutas para exportar.');return;}
  const features=[];
  routes.forEach(r=>{
    ['ida','vuelta'].forEach(variant=>{
      r[variant].forEach(s=>{
        const si=segIndexById.get(s.segId);if(!si)return;
        features.push({type:'Feature',properties:{nombre_ruta:r.nombre,sentido:variant,color:r.color,ruta_id:r.id,seg_id:s.segId},geometry:{type:'LineString',coordinates:si.latlngs.map(ll=>[ll[1],ll[0]])}});
      });
    });
  });
  if(!features.length){alert('Las rutas no tienen segmentos trazados.');return;}
  downloadText('rutacore-export.geojson',JSON.stringify({type:'FeatureCollection',properties:{tipo:'rutacore-export',exportadoEn:new Date().toISOString()},features},null,2));
});

el('export-red').addEventListener('click',()=>{
  el('export-menu').classList.remove('show');
  if(!redFeatures.length){alert('Cargá la red vial primero.');return;}
  // Los tramos dibujados en el editor no traen atributos: se marcan para identificarlos en QGIS
  const features=redFeatures.map(f=>{
    const props=f.properties&&Object.keys(f.properties).length?f.properties:{origen:'dibujado_rutacore'};
    return {type:'Feature',properties:props,geometry:f.geometry};
  });
  downloadText('rutacore-red-vial.geojson',JSON.stringify({type:'FeatureCollection',features}));
});

/* ── SESIÓN ── */
el('export-session').addEventListener('click',()=>{
  el('export-menu').classList.remove('show');
  if(!redFeatures.length){alert('Cargá la red vial primero.');return;}
  downloadText('rutacore-sesion.json',JSON.stringify({version:1,tipo:'rutacore-session',guardadoEn:new Date().toISOString(),redFeatures,routes}));
});
el('btn-load-session').addEventListener('click',()=>el('file-session').click());
el('import-session') && el('import-session').addEventListener('click',()=>{el('export-menu').classList.remove('show');el('file-session').click();});
el('file-session').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  showLoader('Restaurando sesión…');
  try{
    const s=JSON.parse(await file.text());
    if(s.tipo!=='rutacore-session')throw new Error('No es una sesión de RutaCore.');
    if(redLayer){map.removeLayer(redLayer);redLayer=null;}
    segIndex=[];routes=[];undoStack=[];redoStack=[];activeRouteId=null;
    disableTrace();
    redFeatures=s.redFeatures||[];

    // ── Migración de sesiones con segId viejo (correlativo) a segId estable (por geometría) ──
    // Si la ruta trae IDs numéricos de una versión anterior, se reconstruye el segIndex
    // tal como se generaba antes (orden de iteración = orden del array) SOLO para traducir
    // cada segId viejo a su nuevo ID estable, usando la propia geometría guardada en la sesión.
    function buildOldIdMap(feats){
      const map=new Map(); let counter=0;
      feats.forEach(f=>{
        const oldId=++counter;
        if(!f.geometry)return;
        let coords=[];
        const g=f.geometry;
        if(g.type==='LineString')coords=g.coordinates;
        else if(g.type==='MultiLineString')coords=g.coordinates[0]||[];
        const latlngs=coords.map(c=>[c[1],c[0]]);
        if(!latlngs.length)return;
        const stable=segIdFromLatLngs(latlngs);
        if(stable!==null)map.set(oldId,stable);
      });
      return map;
    }
    const oldIdMap=buildOldIdMap(redFeatures);
    function remapVariant(arr){
      return (arr||[]).map(s=>{
        if(isOldNumericSegId(s.segId)) return {segId:oldIdMap.get(Number(s.segId))||null};
        return s;
      }).filter(s=>s.segId!==null);
    }

    renderRed();
    const bounds=redBounds||L.latLngBounds([]);
    if(bounds.isValid())map.fitBounds(bounds,{padding:[30,30]});

    let segsAntes=0, segsPerdidos=0;
    routes=(s.routes||[]).map(r=>{
      const idaRemap=remapVariant(r.ida), vueltaRemap=remapVariant(r.vuelta);
      segsAntes+=(r.ida||[]).length+(r.vuelta||[]).length;
      const idaFinal=idaRemap.filter(s=>segIndexById.has(s.segId));
      const vueltaFinal=vueltaRemap.filter(s=>segIndexById.has(s.segId));
      segsPerdidos+=(idaRemap.length-idaFinal.length)+(vueltaRemap.length-vueltaFinal.length);
      return{
        ...r,
        vis:r.vis!==false,visIda:r.visIda!==false,visVuelta:r.visVuelta!==false,
        ida:idaFinal, vuelta:vueltaFinal,
      };
    });
    refreshAllStyles();
    if(segsPerdidos>0){
      alert(`Atención: ${segsPerdidos} de ${segsAntes} segmentos trazados no se pudieron ubicar en la red actual (probablemente la red cambió). El resto de la sesión se restauró con normalidad.`);
    }
    el('status-pill').textContent=`${redFeatures.length.toLocaleString('es-PE')} segmentos`;
    el('status-pill').classList.add('ok');
    el('btn-load-red').classList.remove('primary');el('btn-load-red').classList.add('loaded');el('btn-load-red').innerHTML='<i class="fa-solid fa-check"></i> Red cargada';
    el('btn-trace').disabled=false;el('btn-delete-seg').disabled=true;
    el('btn-undo').disabled=true;el('btn-redo').disabled=true;el('btn-ruler').disabled=false;
    el('btn-edit-network').disabled=false;
    el('btn-export').disabled=!redFeatures.length;
    el('new-route-name').disabled=false;el('btn-add-route').disabled=false;
    if(routes.length)activeRouteId=routes[0].id;
    renderRoutesPanel();updateInfoBar();
    setInstruction('Sesión restaurada — seleccioná una ruta para continuar trazando');
  }catch(err){alert('Error al cargar sesión: '+err.message);}
  hideLoader();e.target.value='';
});
</script>
